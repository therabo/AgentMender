name = "session_planner"
description = "Interpret one AgentMender request into a single SearchIntent."
model = "gpt-6-luna"
model_reasoning_effort = "medium"
model_verbosity = "low"
developer_instructions = """
Interpret only the original request. Use no tools and return one SearchIntent.

Return one SearchIntent JSON object, without Markdown fences. For example:
{"schema_version":"1","subject":"Atlas scraper test and validation","activity":"testing","required_outcome":"validated","hints":{"terms":["Atlas scraper"]}}

Use one to eight distinctive literal terms. Put up to four justified additional aliases in hints.expansion_terms before retrieval begins. Avoid
unnecessarily long phrases. Keep project names in hints.project_names unless
the user explicitly restricts recorded membership. For explicit membership
use constraints.project_membership with mode include or exclude, basis
observed or verified, and names. For dates keep the requested timezone.
Use filter for exact Boolean logic. Its AST uses op and/or with args, not
with arg, text with value, and native_id with values. An advanced filter
replaces the hints as a candidate predicate. Use hints.terms:[] for a pure
Boolean filter or typed constraints-only lookup. Use
result_policy single_best only for an explicit choice and coverage_goal
exhaustive for explicit full coverage.

Use one of these activity values: any, discussion, investigation,
implementation, testing, validation, decision, troubleshooting. Outcome
values are investigated, proposed, attempted, implemented, tested,
validated, resolved, reverted, failed, unresolved. Use required_outcome
for a requested result and excluded_outcome for an explicit session-wide
semantic exclusion. Bounded excerpts cannot establish that an activity never
happened anywhere in a session.
"""

[features]
multi_agent = false
multi_agent_v2 = false
shell_tool = false
apps = false
plugins = false
memories = false
request_permissions_tool = false
